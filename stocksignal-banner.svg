<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">STOCKSIGNAL</title>
  <desc id="desc">A teal and midnight-blue banner for a medicine inventory review prototype, with abstract stock bars and a signal line.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2032"/>
      <stop offset="0.58" stop-color="#104A61"/>
      <stop offset="1" stop-color="#087F86"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7FE4D9"/>
      <stop offset="1" stop-color="#B8FFF2"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#D9FBF5" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#03121D" flood-opacity="0.26"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="26" fill="url(#grid)"/>
  <circle cx="1050" cy="48" r="200" fill="#8EF2E6" opacity="0.055"/>
  <circle cx="1070" cy="48" r="140" fill="none" stroke="#A6FFF2" stroke-opacity="0.16"/>
  <circle cx="1070" cy="48" r="105" fill="none" stroke="#A6FFF2" stroke-opacity="0.11"/>
  <g transform="translate(72 74)">
    <rect width="66" height="66" rx="18" fill="#E3FFFA" fill-opacity="0.12" stroke="#B5FFF6" stroke-opacity="0.42"/>
    <path d="M33 14v38M14 33h38" stroke="url(#mint)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="52" cy="14" r="4" fill="#A6FFF2"/>
  </g>
  <text x="158" y="111" fill="#D4F8F4" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="4">RWANDA • OPEN PROTOTYPE</text>
  <text x="70" y="190" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="61" font-weight="800" letter-spacing="-2.5">STOCK<tspan fill="url(#mint)">SIGNAL</tspan></text>
  <text x="74" y="235" fill="#D2EAF0" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400">Turn inventory rows into clearer review signals.</text>
  <g transform="translate(74 270)" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4">
    <rect width="173" height="34" rx="17" fill="#B1FFF0" fill-opacity="0.12" stroke="#B1FFF0" stroke-opacity="0.26"/>
    <text x="18" y="22" fill="#DFFFFA">DATA QUALITY</text>
    <rect x="185" width="154" height="34" rx="17" fill="#B1FFF0" fill-opacity="0.12" stroke="#B1FFF0" stroke-opacity="0.26"/>
    <text x="204" y="22" fill="#DFFFFA">EXPIRY REVIEW</text>
    <rect x="351" width="170" height="34" rx="17" fill="#B1FFF0" fill-opacity="0.12" stroke="#B1FFF0" stroke-opacity="0.26"/>
    <text x="370" y="22" fill="#DFFFFA">STOCK COVER</text>
  </g>
  <g transform="translate(770 88)" filter="url(#shadow)">
    <rect width="342" height="206" rx="22" fill="#FFFFFF" fill-opacity="0.96"/>
    <text x="24" y="34" fill="#587082" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.8">REVIEW SIGNALS</text>
    <g transform="translate(24 53)">
      <rect width="294" height="38" rx="10" fill="#F0F7F9"/>
      <circle cx="19" cy="19" r="6" fill="#E8A13B"/>
      <text x="36" y="23" fill="#19364A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Data quality checks</text>
      <path d="M267 14l5 5 9-10" fill="none" stroke="#087F86" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(24 100)">
      <rect width="294" height="38" rx="10" fill="#F0F7F9"/>
      <circle cx="19" cy="19" r="6" fill="#D45C64"/>
      <text x="36" y="23" fill="#19364A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Expiry date warnings</text>
      <path d="M267 14l5 5 9-10" fill="none" stroke="#087F86" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(24 147)">
      <rect width="294" height="38" rx="10" fill="#F0F7F9"/>
      <circle cx="19" cy="19" r="6" fill="#087F86"/>
      <text x="36" y="23" fill="#19364A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Estimated stock cover</text>
      <path d="M267 14l5 5 9-10" fill="none" stroke="#087F86" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
